# =============================================================================
# Nginx — reverse proxy TLS pour Nextcloud + ONLYOFFICE
# -----------------------------------------------------------------------------
# ⚠️ Remplacez cloud.example.com par votre sous-domaine.
# Les certificats sont fournis par Certbot (challenge DNS-01) et montés
# depuis ./certbot/etc -> /etc/letsencrypt (lecture seule).
#
# Validation : docker compose exec nginx nginx -t
# =============================================================================

# Requis pour les WebSockets d'ONLYOFFICE
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name cloud.example.com;

    return 301 https://cloud.example.com$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name cloud.example.com;

    ssl_certificate     /etc/letsencrypt/live/cloud.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Aligné sur PHP_UPLOAD_LIMIT / APACHE_BODY_LIMIT (10G)
    client_max_body_size 10G;

    # ------------------------- Nextcloud -------------------------------------
    location / {
        proxy_pass http://nextcloud/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_request_buffering off;
        proxy_buffering          off;
        proxy_read_timeout       3600s;
        proxy_send_timeout       3600s;
    }

    # ------------------------- ONLYOFFICE -------------------------------------
    # Architecture documentée par ONLYOFFICE : DocumentServer publié sous
    # /editors/ derrière le même reverse proxy que Nextcloud.
    location /editors/ {
        proxy_pass http://onlyoffice/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        # Indispensable à ONLYOFFICE quand il est publié sous /editors/
        proxy_set_header X-Forwarded-Host  $http_host/editors;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering          off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }
}
